# ============================================================
# MonoEv Stage-1
# ============================================================
# Train
# ============================================================
[Train]
iterations = 1000
lambda_dssim = 0.2
sh_degree = 3
random_points = False
test_interval = 100
save_interval = 200
# ============================================================
# Camera Alignment
# ============================================================
[Camera Alignment]
# Fixed calibrated intrinsics.
camera_intrinsics_path = /root/autodl-tmp/Mono_Data/Lego/camera_intrinsics.json
camera_alignment_output = /root/autodl-tmp/MonoEv/Stage1/Lego/round1/alignment
camera_prior_path = None
# ------------------------------------------------------------
# Legacy intrinsic-search parameters
# ------------------------------------------------------------
# Fixed-intrinsics Stage-1 does NOT optimize the intrinsics.
region_grid_rows = 4
region_grid_cols = 4
region_min_foreground_pixels = 8
region_global_iou_weight = 1.0
region_equal_iou_weight = 3.0
region_missing_weight = 2.0
region_ssim_weight = 4.0
region_worst_ssim_weight = 4.0
region_ssim_min_pixels = 8
region_ssim_mask_erode = 0
region_ssim_window = 5
region_ssim_alpha_min = 0.10
camera_init_fov_x = 50.0
camera_init_rx_deg = 0.0
camera_init_ry_deg = 0.0
camera_init_rz_deg = 0.0
camera_align_lambda_l1 = 0.8
camera_align_lambda_ssim = 0.2
camera_align_max_iterations = 300
camera_align_xtol = 0.0001
camera_align_ftol = 0.00001
camera_align_fov_min_deg = 15.0
camera_align_fov_max_deg = 100.0
camera_align_translation_limit_factor = 6.0
structure_restart_angle_deg = 25
structure_local_restarts = 15
structure_restart_maxfev = 300
# ============================================================
# Stage-1 G0 Refinement
# ============================================================
[Stage1 G0 Refinement]
# ------------------------------------------------------------
# Basic Stage-1 settings
# ------------------------------------------------------------
stage1_front_surface_only_updates = True
stage1_uncertain_update_weight = 0.0
stage1_preserve_original_appearance = True
stage1_train_color_dc = True
stage1_restore_original_opacity = False
stage1_iterations = 800
stage1_diag_interval = 100
stage1_lambda_dssim = 0.2
# ------------------------------------------------------------
# Object / silhouette supervision
# ------------------------------------------------------------
stage1_lambda_rgb = 4.0
stage1_lambda_color = 2.0
stage1_lambda_ssim = 5.0
stage1_lambda_alpha = 4.0
stage1_lambda_opacity = 3.0
stage1_lambda_edge = 4.0
stage1_lambda_missing = 3.0
stage1_lambda_extra = 3.0
stage1_lambda_anchor = 2.0
stage1_lambda_smooth = 0.50
stage1_lambda_depth = 0.50
# Surface continuity regularization.
stage1_lambda_coverage = 0.05
stage1_coverage_beta = 0.60
stage1_coverage_spacing_cap_mult = 3.0
# Strict mode may prune original G0 points, so the original prefix must NOT
# be treated as permanently protected.
stage1_protect_original_g0_surface = false
stage1_lock_original_g0_footprint = false
# These become effectively inactive for pruned original-prefix points in strict mode.
stage1_lambda_scale_anchor = 0.0
stage1_lambda_overlap = 0.20
stage1_overlap_sigma_mult = 2.5
# ------------------------------------------------------------
# STRICT CONTOUR FROM ITERATION 1
# ------------------------------------------------------------
# Hard contour handling is enabled from the beginning.
stage1_strict_contour_from_start = true
# At every topology update, immediately refill newly exposed holes.
stage1_strict_surface_fill = true
# Check topology frequently so delete/shrink/fill happen continuously.
stage1_topology_interval = 5
# Each topology update performs several local closure rounds:
# render -> detect missing -> seed -> hard contour -> render again.
stage1_surface_closure_passes_per_update = 4
# Final closure before saving.
stage1_final_surface_closure_passes = 10
# Allow enough Gaussian budget for strict refill after pruning.
stage1_max_gaussian_ratio = 2.0
stage1_strict_min_gaussian_ratio = 1.2
# ------------------------------------------------------------
# HARD silhouette support
# ------------------------------------------------------------
# Small positive safety margin keeps the finite rasterized support inside mask.
stage1_hard_mask_safety_px = 0.30
# If support must be reduced below 15% of its current radius to fit,
# pruning is safer than keeping an extremely tiny splat.
stage1_hard_mask_min_scale_factor = 0.15
# ------------------------------------------------------------
# Missing-region definition / surface fill
# ------------------------------------------------------------
# Any foreground pixel with alpha <= this value is treated as missing.
stage1_missing_alpha_threshold = 0.30
# In strict mode do NOT morphologically erase small missing regions.
stage1_structure_cleanup_radius = 0
stage1_structure_cleanup_occupancy = 0.0
# Pixel-level scan of missing foreground.
stage1_strict_missing_seed_stride = 1
# Large refill budget per update. Overall point budget above still applies.
stage1_strict_missing_max_seeds_per_update = 2048
# Compatibility values for the non-strict seeding path.
stage1_missing_seed_stride = 1
stage1_missing_max_seeds_per_update = 2048
# Put the child directly under the missing pixel at the selected parent's depth.
stage1_missing_seed_step = 1.0
# Limit parent search distance only enough to reject unrelated regions.
stage1_missing_parent_max_distance_px = 96.0
stage1_missing_nn_chunk = 128
# Depth-aware parent selection: disabled for the first BASE regression test.
# Turn on separately to evaluate the new parent selection behavior.
stage1_missing_depth_aware_parent = False
stage1_missing_depth_knn = 8
stage1_missing_depth_local_radius_px = 4.0
stage1_missing_depth_weight = 1.0
# ------------------------------------------------------------
# Newly seeded Gaussian properties
# ------------------------------------------------------------
# Newly created splats should actually cover holes immediately.
stage1_seed_surface_opacity = 0.5
stage1_seed_surface_coverage_beta = 0.75
stage1_seed_surface_scale_factor = 1.0
stage1_seed_surface_scale_max_boost = 1.25
stage1_seed_color_radius = 2
# Do not seed directly on uncertain boundary pixels.
# ------------------------------------------------------------
# Scale floor / anti-hole coverage
# ------------------------------------------------------------
# Newly exposed undersized visible splats may be enlarged.
# Hard contour projection runs afterwards, so boundary splats are shrunk back
# if enlargement would cross the silhouette.
stage1_enable_scale_floor = true
stage1_scale_floor_beta = 0.68
stage1_scale_floor_spacing_cap_mult = 3.0
stage1_scale_floor_max_boost = 1.15
stage1_scale_floor_min_opacity = 0.03
# ------------------------------------------------------------
# Residual-gated Gaussian optimization
# ------------------------------------------------------------
stage1_residual_low = 0.02
stage1_residual_high = 0.08
stage1_residual_gamma = 1.0
stage1_gradient_floor = 0.02
stage1_extra_gradient_floor = 0.75
stage1_densify_weight_threshold = 0.60
# ------------------------------------------------------------
# Foreground / background segmentation
# ------------------------------------------------------------
stage1_bg_border_px = 12
stage1_bg_distance_quantile = 0.995
stage1_bg_min_lab_distance = 12.0
stage1_bg_distance_margin = 5.0
# Preserve exact extracted foreground shape.
stage1_mask_close_radius = 0
stage1_mask_open_radius = 0
stage1_explicit_mask_threshold = 0.5
# ------------------------------------------------------------
# Photometric / alpha details
# ------------------------------------------------------------
stage1_photometric_mask_erode = 1
stage1_ssim_crop_padding = 16
stage1_color_alpha_min = 0.15
stage1_color_support_erode = 1
stage1_alpha_bce_fraction = 0.50
stage1_alpha_dice_fraction = 0.50
stage1_opacity_interior_erode = 2
stage1_opacity_exterior_dilate = 2
stage1_opacity_outside_fraction = 0.50
stage1_edge_target_threshold = 0.05
stage1_edge_render_threshold = 0.05
stage1_edge_band_dilation = 6
# ------------------------------------------------------------
# Error map
# ------------------------------------------------------------
stage1_error_map_rgb_weight = 1.0
stage1_error_map_alpha_weight = 1.5
stage1_error_map_missing_boost = 1.5
stage1_error_map_extra_boost = 1.0
stage1_error_map_normalizer = 1.0
# ------------------------------------------------------------
# Gaussian learning rates
# ------------------------------------------------------------
stage1_position_lr_init = 0.00002
stage1_position_lr_final = 0.000002
stage1_position_lr_delay_mult = 0.01
# Hard contour shrink and scale-floor adjustment are direct geometric operations.
# Keep optimizer-driven scaling/rotation disabled to avoid unstable footprint drift.
stage1_scaling_lr = 0.0
stage1_rotation_lr = 0.0
stage1_opacity_refine_lr = 0.0
stage1_color_lr = 0.0025
stage1_grad_clip = 1.0
# ------------------------------------------------------------
# Topology
# ------------------------------------------------------------
# Native 3DGS densification remains disabled.
# Missing-region seeding is the controlled mechanism used to add points.
stage1_enable_native_densify = false
# Keep the compatibility stop at the full Stage-1 length.
# In strict_surface_fill mode explicit missing-region seeding remains active
# throughout the whole run.
stage1_densify_stop_iter = 1000
stage1_densify_grad_threshold = 0.0007
stage1_densification_interval = 5
stage1_min_opacity = 0.005
stage1_max_screen_size = 20
# Conservative auxiliary extra-alpha pruning.
stage1_extra_prune_max_fraction = 0.01
stage1_extra_prune_opacity_max = 1.0
# ------------------------------------------------------------
# Fixed-view G0 depth preservation
# ------------------------------------------------------------
stage1_depth_alpha_min = 0.10
stage1_depth_current_alpha_min = 0.05
stage1_depth_smooth_l1_beta = 0.02
# ------------------------------------------------------------
# Frozen DINO feature prior
# ------------------------------------------------------------
# Disabled in the recommended multi-view ablation because the current Lego
# experiment showed no clear gain. It can be re-enabled independently.
stage1_enable_feature_prior = false
stage1_lambda_feature_prior = 0.0
stage1_feature_every = 10
stage1_feature_input_size = 224
# ------------------------------------------------------------
# Raw-G0 multi-view pruning protection V2 (disabled for BASE)
# ------------------------------------------------------------
stage1_enable_multiview_guard = false
stage1_mv_views = -60:0;-30:0;30:0;60:0;0:-25;0:25
stage1_mv_teacher_alpha_min = 0.05
stage1_mv_min_projected_radius = 0.0
stage1_mv_protect_hidden = true
stage1_mv_protect_uncertain = true
stage1_mv_protect_outside = true
stage1_mv_protect_visible_front = false
stage1_mv_min_raw_opacity = 0.03
stage1_mv_match_spacing_mult = 1.75
stage1_mv_match_min_distance = 0.0
# ============================================================
[Stage1 Pipeline]
stage1_pipeline_root = /root/autodl-tmp/MonoEv/Stage1
stage1_round1_dir = /root/autodl-tmp/MonoEv/Stage1/Lego/round1
stage1_refinement_output = /root/autodl-tmp/MonoEv/Stage1/Lego/round1/refinement
stage1_final_dir = /root/autodl-tmp/MonoEv/Stage1/Lego/lego_stage1_final
[MonoEv Stage3]
freeze_canonical_g0 = False
lambda_canonical_deform = 0.0
lambda_canonical_xyz = 1.0
lambda_canonical_rotation = 0.1
lambda_canonical_scaling = 0.1
# ------------------------------------------------------------
# Soft G0 prior
# ------------------------------------------------------------
lambda_g0_prior = 10.0
lambda_g0_xyz = 1.0
lambda_g0_rotation = 0.1
lambda_g0_scaling = 0.1
g0_prior_sample_size = 8192
t0_anchor_interval = 5
deform_chunk_size = 4096
deform_regularizer_sample_size = 2048
canonical_sample_size = 4096
use_deform_checkpoint = True
# ============================================================
# Event training
# ============================================================
[Train Event]
lambda_t0_deform = 0.0
event_assist = True
bin_num = 64
# ============================================================
# Event loss
# ============================================================
[Event Loss]
fixed_threshold = 0.2
threshold_init = 0.2
minimum_threshold = 0.01
threshold_lr = 0.001
lambda_event_recon = 1.0
lambda_event_tv = 0.005
lambda_threshold_prior = 0.0001
charbonnier_eps = 0.001
event_log_eps = 0.0001
event_void_jitter_sigma = 0.02
event_slice_min_events = 1000
event_slice_max_events = 5000
event_response_r = 0.299
event_response_g = 0.587
event_response_b = 0.114
# ============================================================
# Device
# ============================================================
[Device]
data_device = cuda
load2gpu_on_the_fly = False
# ============================================================
# Paths
# ============================================================
[Path]
source_path = /root/autodl-tmp/Mono_Data/Lego
initial_gaussian_ply = /root/autodl-tmp/Mono_Data/Lego/Lego.ply
camera_file = /root/autodl-tmp/MonoEv/Stage1/Lego/round1/alignment/fixed_camera.json
t0_image_path = /root/autodl-tmp/Mono_Data/Lego/Lego.png
t0_mask_path = None
event_path = /root/autodl-tmp/Mono_Data/Lego/Lego_event.npy
pcd_path = None
model_path = /root/autodl-tmp/MonoEv/Stage1/Lego/round1/refinement
diagnostics_path = /root/autodl-tmp/MonoEv/Stage1/Lego/round1/refinement/diagnostics
# ============================================================
# G0 appearance stabilization
# ============================================================
# 使用 G0 自己的颜色作为颜色参考
stage1_lock_g0_smoothed_color = false
# 1.0 = 完全锁定到平滑后的 G0 颜色
stage1_g0_color_lock_strength = 0.0
# G0 局部颜色平均范围
# 越大，同一片表面颜色越统一
stage1_g0_color_voxel_mult = 6.0
# 0 = 完全保留原颜色
# 1 = 完全采用邻域平均颜色
stage1_g0_color_smooth_blend = 0.0
# 渲染层面额外压制花斑
stage1_lambda_g0_appearance_smooth = 0.0
stage1_g0_render_smooth_radius = 2
stage1_g0_smooth_detail_threshold = 0.035
stage1_g0_smooth_alpha_min = 0.55
stage1_g0_smooth_mask_erode = 3
# 与正面 SH-DC 优化保持一致（当前 Stage-1 主程序未读取此项）
stage1_color_start_iter = 0
# ============================================================
# RGB preprocessing
# ============================================================
[RGB Data Preprocessing]
white_background = True
eval = True
is_blender = True
# ============================================================
# Event preprocessing
# ============================================================
[Event Data Preprocessing]
event_height = 640
event_width = 640
event_time_unit = s
event_zero_time = True
# ============================================================
# Visualization
# ============================================================
[Visualization]
save_render_at_event = True
save_render_at_event_interval = 100
# ============================================================
# Base learning rates
# ============================================================
#
# These remain for compatibility with GaussianModel /
# training_setup.
#
# Stage1-specific values above override these inside Stage-1.
[Learning Rate]
position_lr_init = 0.00002
feature_lr = 0.0
opacity_lr = 0.0
scaling_lr = 0.0
rotation_lr = 0.0
# ============================================================
# Scheduling
# ============================================================
[Scheduling]
position_lr_final = 0.000002
position_lr_delay_mult = 0.01
position_lr_max_steps = 300
deform_lr_max_steps = 300
# ============================================================
# Base 3DGS densification compatibility
# ============================================================
[Densification]
percent_dense = 0.01
densification_interval = 20
# Effectively disabled.
opacity_reset_interval = 100000
densify_from_iter = 1
densify_until_iter = 300
densify_grad_threshold = 0.0007
# ============================================================
# Other
# ============================================================
[Other]
resolution = -1
images = images
is_6dof = False
convert_shs_python = False
compute_cov3d_python = False
debug = False
ip = 127.0.0.1
port = 6009
quiet = False
detect_anomaly = False
# ============================================================
# Stage-1 additional contour / edge supervision
# ============================================================
stage1_lambda_outside_ring = 4.0
stage1_outside_ring_inner_px = 1
stage1_outside_ring_outer_px = 7
# Seed only inside reliable foreground.
stage1_seed_foreground_erode = 3

# Evaluation only: no LPIPS training loss
stage1_eval_lpips = true
stage1_eval_lpips_net = alex